<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Munduk Tentrem — Staff Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E6;
  --ink:#26291F;
  --ink-soft:#5B5D4F;
  --pine:#2F3F30;
  --pine-deep:#212D22;
  --sand:#ECE5D2;
  --sand-line:#DAD1B8;
  --stone:#C7C1AE;
  --gold:#C08A2E;
  --gold-soft:#EEDCB1;
  --brick:#A85138;
  --brick-soft:#EFD3C7;
  --plum:#7C5169;
  --plum-soft:#E7D6E0;
  --sage:#5F7A54;
  --sage-soft:#DDE6D3;
  --clay:#9C6B3B;
  --clay-soft:#EEDFC9;
  --mist:#5A7686;
  --mist-soft:#DCE5E8;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
body{padding-bottom:40px;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}

/* ===== Header ===== */
.hero{
  background:linear-gradient(160deg, var(--pine) 0%, var(--pine-deep) 100%);
  color:#F2EFE2;
  padding:22px 18px 26px;
  position:relative;
  overflow:hidden;
}
.hero svg.contours{position:absolute; inset:0; opacity:.16; width:100%; height:100%;}
.hero-content{position:relative; z-index:1;}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.72; font-weight:600; margin-bottom:4px;}
.hero h1{font-size:24px; font-weight:600; margin:0 0 2px; letter-spacing:-.01em;}
.hero .sub{font-size:12.5px; opacity:.78; font-weight:400;}

/* ===== Tabs ===== */
.tabs{display:flex; gap:6px; padding:14px 16px 0; background:var(--bg);}
.tab-btn{
  flex:1; text-align:center; padding:10px 8px; border-radius:10px; border:1px solid var(--sand-line);
  background:var(--sand); color:var(--ink-soft); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
  cursor:pointer; transition:all .15s;
}
.tab-btn.active{background:var(--pine); color:#F2EFE2; border-color:var(--pine);}

/* ===== Content wrap ===== */
.content{padding:14px 16px 8px;}

/* ===== Date nav (By Date view) ===== */
.date-nav{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.date-nav button.arrow{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--sand-line); background:#fff;
  font-size:16px; color:var(--pine); cursor:pointer; flex-shrink:0;
}
.date-nav button.arrow:disabled{opacity:.3;}
.date-display{flex:1; text-align:center;}
.date-display .dow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
.date-display .dnum{font-family:'Fraunces',serif; font-size:22px; font-weight:600; line-height:1.15;}
.date-display .holiday-tag{
  display:inline-block; margin-top:2px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;
}
.date-scrub{display:flex; gap:5px; overflow-x:auto; padding:10px 2px 4px; margin-bottom:10px; scrollbar-width:none;}
.date-scrub::-webkit-scrollbar{display:none;}
.date-chip{
  flex-shrink:0; width:44px; padding:7px 0; border-radius:10px; text-align:center; border:1px solid var(--sand-line);
  background:#fff; cursor:pointer; font-size:11px; color:var(--ink-soft);
}
.date-chip .cd{font-weight:700; font-size:14px; color:var(--ink);}
.date-chip.selected{background:var(--pine); border-color:var(--pine);}
.date-chip.selected, .date-chip.selected .cd{color:#F2EFE2;}
.date-chip.ph{border-color:var(--gold);}

/* ===== Department cards ===== */
.dept{margin-bottom:12px;}
.dept-title{
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--pine);
  margin:0 0 6px 2px; display:flex; align-items:center; gap:6px;
}
.dept-title::before{content:''; width:10px; height:2px; background:var(--gold); display:inline-block;}
.staff-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff; border:1px solid var(--sand-line); border-radius:var(--radius);
  padding:11px 13px; margin-bottom:6px;
}
.staff-info{min-width:0;}
.staff-name{font-size:14px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.staff-pos{font-size:11px; color:var(--ink-soft); margin-top:1px;}
.shift-badge{
  flex-shrink:0; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; min-width:52px; text-align:center;
}

/* ===== Staff view ===== */
.staff-picker{margin-bottom:12px;}
.search-box{
  width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--sand-line); background:#fff;
  font-size:14px; font-family:'Inter',sans-serif; margin-bottom:10px;
}
.staff-list{display:flex; flex-direction:column; gap:6px; max-height:0; overflow:hidden; transition:max-height .25s ease;}
.staff-list.open{max-height:2000px;}
.staff-pick-row{
  display:flex; justify-content:space-between; align-items:center; padding:10px 13px; background:#fff;
  border:1px solid var(--sand-line); border-radius:10px; cursor:pointer; font-size:13.5px;
}
.staff-pick-row .name{font-weight:600;}
.staff-pick-row .dept-tag{font-size:10.5px; color:var(--ink-soft);}
.selected-staff-header{
  background:#fff; border:1px solid var(--sand-line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center; cursor:pointer;
}
.selected-staff-header .name{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
.selected-staff-header .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.month-grid{display:flex; flex-direction:column; gap:5px;}
.month-row{
  display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--sand-line);
  border-radius:10px; padding:9px 13px;
}
.month-row .md{width:56px; flex-shrink:0;}
.month-row .md .dow{font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em;}
.month-row .md .num{font-weight:700; font-size:14px;}
.month-row .badge-wrap{flex:1; text-align:right;}
.month-row.is-ph{background:var(--gold-soft);}
.month-row.is-flag{background:var(--brick-soft);}

/* ===== Legend ===== */
.legend-toggle{
  width:100%; text-align:left; background:var(--sand); border:1px solid var(--sand-line); border-radius:12px;
  padding:12px 14px; font-size:13px; font-weight:600; color:var(--pine); cursor:pointer; margin-top:6px;
  display:flex; justify-content:space-between; align-items:center;
}
.legend-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.legend-body.open{max-height:900px; margin-top:8px;}
.legend-grid{display:flex; flex-direction:column; gap:6px;}
.legend-item{display:flex; align-items:center; gap:10px; font-size:12.5px; background:#fff; border:1px solid var(--sand-line); border-radius:10px; padding:9px 12px;}
.legend-item .dot{width:34px; text-align:center; font-size:11px; font-weight:700; padding:4px 0; border-radius:8px; flex-shrink:0;}
.legend-item .desc{color:var(--ink-soft);}

.empty-note{font-size:12.5px; color:var(--ink-soft); text-align:center; padding:24px 10px;}
</style>
</head>

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return { dow: DOW_NAMES[d.getDay()], day: d.getDate(), month: MONTH_NAMES[d.getMonth()] };
}

let dateIdx = SCHEDULE.dates.indexOf('2026-08-01');
if(dateIdx < 0) dateIdx = 0;

// ---------- BY DATE VIEW ----------
function renderDateView(){
  const iso = SCHEDULE.dates[dateIdx];
  const f = fmtDate(iso);
  document.getElementById('cur-dow').textContent = f.dow + 'day';
  document.getElementById('cur-dnum').textContent = f.day + ' ' + f.month + ' 2026';
  const holidayEl = document.getElementById('cur-holiday');
  if(PH_DATES[iso]){
    const isFlag = iso === '2026-08-25';
    holidayEl.innerHTML = `<span class="holiday-tag" style="background:${isFlag ? 'var(--brick-soft)' : 'var(--gold-soft)'}; color:${isFlag ? 'var(--brick)' : 'var(--gold)'}">${PH_DATES[iso]}</span>`;
  } else {
    holidayEl.innerHTML = '';
  }

  document.getElementById('prev-day').disabled = dateIdx === 0;
  document.getElementById('next-day').disabled = dateIdx === SCHEDULE.dates.length - 1;

  // department cards
  const wrap = document.getElementById('date-departments');
  wrap.innerHTML = '';
  SCHEDULE.sections.forEach(sec => {
    const deptDiv = document.createElement('div');
    deptDiv.className = 'dept';
    const title = document.createElement('div');
    title.className = 'dept-title';
    title.textContent = sec.name;
    deptDiv.appendChild(title);
    sec.staff.forEach(st => {
      const val = st.shifts[dateIdx];
      const meta = shiftMeta(val);
      const row = document.createElement('div');
      row.className = 'staff-row';
      row.innerHTML = `
        <div class="staff-info">
          <div class="staff-name">${st.name}</div>
          <div class="staff-pos">${st.position || ''}</div>
        </div>
        <div class="shift-badge" style="background:${meta.bg}; color:${meta.fg}">${meta.label}</div>
      `;
      deptDiv.appendChild(row);
    });
    wrap.appendChild(deptDiv);
  });

  renderScrub();
}

function renderScrub(){
  const scrub = document.getElementById('date-scrub');
  scrub.innerHTML = '';
  SCHEDULE.dates.forEach((iso, i) => {
    const f = fmtDate(iso);
    const chip = document.createElement('div');
    chip.className = 'date-chip' + (i === dateIdx ? ' selected' : '') + (PH_DATES[iso] ? ' ph' : '');
    chip.innerHTML = `<div>${f.dow}</div><div class="cd">${f.day}</div>`;
    chip.onclick = () => { dateIdx = i; renderDateView(); scrollChipIntoView(); };
    scrub.appendChild(chip);
  });
  scrollChipIntoView();
}
function scrollChipIntoView(){
  const scrub = document.getElementById('date-scrub');
  const chip = scrub.children[dateIdx];
  if(chip) scrub.scrollLeft = chip.offsetLeft - scrub.clientWidth/2 + chip.clientWidth/2;
}

document.getElementById('prev-day').onclick = () => { if(dateIdx>0){ dateIdx--; renderDateView(); } };
document.getElementById('next-day').onclick = () => { if(dateIdx<SCHEDULE.dates.length-1){ dateIdx++; renderDateView(); } };

// ---------- BY STAFF VIEW ----------
let allStaff = [];
SCHEDULE.sections.forEach(sec => sec.staff.forEach(st => allStaff.push({...st, dept: sec.name})));
let selectedStaffName = null;

function renderStaffList(filter){
  const listEl = document.getElementById('staff-list');
  listEl.innerHTML = '';
  const f = (filter||'').toLowerCase();
  allStaff.filter(st => st.name.toLowerCase().includes(f)).forEach(st => {
    const row = document.createElement('div');
    row.className = 'staff-pick-row';
    row.innerHTML = `<span class="name">${st.name}</span><span class="dept-tag">${st.dept}</span>`;
    row.onclick = () => { selectedStaffName = st.name; renderStaffDetail(); listEl.classList.remove('open'); };
    listEl.appendChild(row);
  });
}

function renderStaffDetail(){
  const detailEl = document.getElementById('staff-detail');
  if(!selectedStaffName){ detailEl.innerHTML = '<div class="empty-note">Pick a staff member above to see their full schedule.</div>'; return; }
  const st = allStaff.find(s => s.name === selectedStaffName);
  let html = `
    <div class="selected-staff-header" id="staff-header-toggle">
      <div>
        <div class="name">${st.name}</div>
        <div class="meta">${st.position || ''} · ${st.dept} · Day off: ${st.libur || '—'}</div>
      </div>
      <div style="font-size:20px; color:var(--pine);">⌄</div>
    </div>
    <div class="month-grid">
  `;
  SCHEDULE.dates.forEach((iso, i) => {
    const f = fmtDate(iso);
    const val = st.shifts[i];
    const meta = shiftMeta(val);
    const isPH = !!PH_DATES[iso];
    const isFlag = iso === '2026-08-25';
    html += `
      <div class="month-row ${isFlag ? 'is-flag' : (isPH ? 'is-ph' : '')}">
        <div class="md"><div class="dow">${f.dow} ${f.month}</div><div class="num">${f.day}</div></div>
        <div class="badge-wrap"><span class="shift-badge" style="background:${meta.bg}; color:${meta.fg}">${meta.label}</span></div>
      </div>
    `;
  });
  html += '</div>';
  detailEl.innerHTML = html;
  document.getElementById('staff-header-toggle').onclick = () => {
    document.getElementById('staff-list').classList.toggle('open');
  };
}

document.getElementById('staff-search').addEventListener('input', e => {
  renderStaffList(e.target.value);
  document.getElementById('staff-list').classList.add('open');
});
document.getElementById('staff-search').addEventListener('focus', () => {
  document.getElementById('staff-list').classList.add('open');
});

// ---------- TABS ----------
document.getElementById('tab-date').onclick = () => {
  document.getElementById('tab-date').classList.add('active');
  document.getElementById('tab-staff').classList.remove('active');
  document.getElementById('view-date').style.display = '';
  document.getElementById('view-staff').style.display = 'none';
};
document.getElementById('tab-staff').onclick = () => {
  document.getElementById('tab-staff').classList.add('active');
  document.getElementById('tab-date').classList.remove('active');
  document.getElementById('view-staff').style.display = '';
  document.getElementById('view-date').style.display = 'none';
};

// ---------- LEGEND ----------
document.getElementById('legend-toggle').onclick = () => {
  document.getElementById('legend-body').classList.toggle('open');
  const arrow = document.getElementById('legend-arrow');
  arrow.textContent = document.getElementById('legend-body').classList.contains('open') ? '▴' : '▾';
};
function renderLegend(){
  const grid = document.getElementById('legend-grid');
  const order = ['M','M2','M3','AFT','SPLIT','OFF','UL','22'];
  grid.innerHTML = order.map(code => {
    const m = SHIFT_META[code];
    return `<div class="legend-item"><div class="dot" style="background:${m.bg}; color:${m.fg}">${m.label}</div><div class="desc">${m.desc}</div></div>`;
  }).join('') + `
    <div class="legend-item"><div class="dot" style="background:var(--gold-soft); color:var(--gold)">NH</div><div class="desc">Aug 17 — Independence Day</div></div>
    <div class="legend-item"><div class="dot" style="background:var(--brick-soft); color:var(--brick)">NH</div><div class="desc">Aug 25 — Muslim Holiday</div></div>
  `;
}

renderLegend();
renderStaffList('');
renderDateView();
</script>

</body>
</html>
